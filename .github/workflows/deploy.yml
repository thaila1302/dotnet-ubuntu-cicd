name: .NET Core CI/CD with Docker

on:
  push:
    branches:
      - develop
      - main

jobs:
  # ==========================================
  # TẦNG 1: CONTINUOUS INTEGRATION (CI) - KIỂM DUYỆT
  # ==========================================
  ci-testing:
    runs-on: self-hosted
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Restore Dependencies
        run: dotnet restore

      - name: Compile and Build Check
        run: dotnet build --no-restore --configuration Release

  # ==========================================
  # TẦNG 2: DEPLOY CHO NHÁNH DEVELOP (STAGING)
  # ==========================================
  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    runs-on: self-hosted
    needs: ci-testing # Bắt buộc phải qua môn CI mới được chạy
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image and Run Staging Container
        run: |
          docker build -t myapp-api:develop .
          docker stop myapp-staging || true
          docker rm myapp-staging || true
          docker run -d --name myapp-staging -p 5001:5000 myapp-api:develop

  # ==========================================
  # TẦNG 3: DEPLOY CHO NHÁNH MAIN (PRODUCTION)
  # ==========================================
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    needs: ci-testing # Bắt buộc phải qua môn CI mới được chạy
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image and Run Production Container
        run: |
          docker build -t myapp-api:main .
          docker stop myapp-production || true
          docker rm myapp-production || true
          docker run -d --name myapp-production -p 5000:5000 myapp-api:main