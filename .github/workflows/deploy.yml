name: .NET Core CI/CD with Docker

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted          
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # --- NHÁNH DEVELOP: Deploy Container lên cổng 5001 ---
    - name: Deploy to Staging (Develop)
      if: github.ref == 'refs/heads/develop'
      run: |
        # 1. Build Docker Image từ file Dockerfile vừa tạo
        docker build -t myapp-api:develop .
        
        # 2. Dừng và xóa container cũ (nếu có) để giải phóng cổng 5001
        docker stop myapp-staging || true
        docker rm myapp-staging || true
        
        # 3. Chạy container mới: Map cổng 5001 của máy Ubuntu vào cổng 5000 bên trong Docker
        docker run -d --name myapp-staging -p 5001:5000 myapp-api:develop

    # --- NHÁNH MAIN: Deploy Container lên cổng 5000 ---
    - name: Deploy to Production (Main)
      if: github.ref == 'refs/heads/main'
      run: |
        # 1. Build Docker Image cho Production
        docker build -t myapp-api:main .
        
        # 2. Dừng và xóa container cũ trên cổng 5000
        docker stop myapp-production || true
        docker rm myapp-production || true
        
        # 3. Chạy container mới: Map cổng 5000 của máy Ubuntu vào cổng 5000 bên trong Docker
        docker run -d --name myapp-production -p 5000:5000 myapp-api:main